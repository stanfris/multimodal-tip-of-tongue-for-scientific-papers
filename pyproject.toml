[project]
name = "dataset-generation"
version = "0.1.0"
description = "Build a persisted ACL-fig plus ACL Anthology markdown research dataset."
readme = "README.md"
authors = [
    { name = "Stan Fris", email = "stanfris2.0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.26.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.0",
    "pyarrow>=19.0.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.0",
    "transformers>=4.40.2",
    "torch",
    "accelerate",
    "torchvision",
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.6.17",
]

[project.scripts]
dataset-generation = "dataset_generation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "streamlit>=1.49.0",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
