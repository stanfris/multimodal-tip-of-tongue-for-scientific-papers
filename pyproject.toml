[project]
name = "dataset-generation"
version = "0.1.0"
description = "Build a multimodal tip-of-the-tongue research dataset for scientific papers."
readme = "README.md"
authors = [
    { name = "Stan Fris", email = "stanfris2.0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "hydra-submitit-launcher>=1.2.0,<2",
    "httpx>=0.28.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.0",
    "pyarrow>=19.0.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.0",
    "transformers>=5.0",
    "torch",
    "accelerate",
    "torchvision",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "kaggle>=2.2.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
dataset-generation = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "streamlit>=1.49.0",
]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "hydra_entry", "hydra_run"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataset_packaging = ["dataset_card.md"]
