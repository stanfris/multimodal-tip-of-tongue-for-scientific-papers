run:
  name: acl_fig_markdown_default
  seed: 13

dataset:
  figure_split: train
  paper_split: train
  data_dir: ../../data
  prefer_local_sources: true
  streaming: false

parser:
  name: acl_fig_markdown

prompt:
  name: visual_interpretation
  version: v1
  template: ../../prompts/visual_interpretation.v1.txt
  variables:
    - filename
    - label
    - markdown

model:
  provider: "null"
  name: "null"
  temperature: 0.0
  batch_size: 1

output:
  dir: ../../data/processed/acl_fig_markdown/train
  format: parquet
