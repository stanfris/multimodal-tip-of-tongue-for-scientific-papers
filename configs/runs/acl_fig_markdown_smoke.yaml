run:
  name: acl_fig_markdown_smoke
  seed: 13

dataset:
  figure_split: train
  paper_split: train
  data_dir: ../../data
  prefer_local_sources: true
  streaming: false
  limit: 100
  paper_limit: 1000

parser:
  name: acl_fig_markdown
  options:
    fallback_suffixes:
      - ".0"
      - "00"
      - "000"
      - "0"

prompt:
  name: visual_interpretation
  version: v1
  template: ../../prompts/visual_interpretation.v1.txt
  variables:
    - filename
    - label
    - markdown

model:
  provider: "null"
  name: "null"
  temperature: 0.0
  batch_size: 1

output:
  dir: ../../data/processed/acl_fig_markdown_smoke
  format: jsonl
