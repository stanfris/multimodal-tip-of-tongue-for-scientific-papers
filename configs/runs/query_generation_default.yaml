run:
  name: query_generation_default
  seed: 13

inputs:
  dataset: ../../data/preprocessed
  clues_dir: ../../data/clues
  split_index:
  split_name:

prompt:
  name: query_generation
  version: v1
  template: ../../prompts/query_generation.v1.txt
  variables:
    - selected_cues

model:
  provider: "transformers"
  name: "Qwen/Qwen3-4B"
  temperature: 0.0
  max_tokens: 220
  device_map: "auto"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  thinking: false

judgement:
  enabled: false
  name: query_judgement
  version: v1
  template: ../../prompts/query_judgement.v1.txt
  provider: "transformers"
  model: "google/gemma-3-27b-it"
  temperature: 0.0
  max_tokens: 900
  device_map: "auto"
  dtype: "bfloat16"
  attn_implementation: "sdpa"

selection:
  modes:
    - visual-only
    - visual-and-text
  visual_component_budget: 3
  textual_component_budget: 3
  allow_partial_components: false
  start_index: 0
  end_index:
  max_examples:
  resume: true

output:
  dir: ../../data/query_collections
