# @package _global_

stage:
  name: extract_mineru
  limit: null
  server_port: 0
  server_startup_timeout: 600
  server_concurrency: 8
  monitor_usage: true
  mineru_venv: .venv-mineru
  server_command: null
  backend: hybrid-engine
  max_in_flight: 8
  retries: 2
  start_index: 0
  end_index: null
  all_domain_pdfs: false
  retry_incomplete_only: false
  domains: null
  effort: medium
  parse_method: auto
  lang: ch
  start_page_id: 0
  end_page_id: null
  poll_interval: 2.0
  request_timeout: 120.0
  result_timeout: 3600.0
  min_markdown_chars: 200
  allow_tiny_markdown: false
  no_formula: false
  no_table: false
  image_analysis: null

hydra:
  job:
    name: extract_mineru
  run:
    dir: ${launcher.log_root}/extraction/extract_mineru/${now:%Y%m%dT%H%M%S}
  sweep:
    dir: ${launcher.log_root}/extraction/extract_mineru/${now:%Y%m%dT%H%M%S}
    subdir: ${hydra.job.num}
