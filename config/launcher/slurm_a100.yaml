# @package _global_

defaults:
  - override /hydra/launcher: submitit_slurm
launcher:
  kind: slurm
  dataset_root: ${oc.env:VTT_DATA_ROOT,/scratch-shared/sfris1}
  processed_root: ${launcher.dataset_root}/processed
  pdf_dir: ${launcher.dataset_root}/pdf_datasets
  split_index: ${launcher.dataset_root}/data/splits/pdf_dataset_split.json
  log_root: ${oc.env:VTT_LOG_ROOT,./logs}
  cache_root: ${oc.env:VTT_CACHE_ROOT,${launcher.dataset_root}/cache}
  model_cache: ${oc.env:HF_HOME,${launcher.cache_root}/huggingface}
  python: ${oc.env:VTT_PYTHON,./.venv/bin/python}
  partition: gpu_a100
  gpus: 1
  cpus: 16
  memory: 32G
  walltime: 03:00:00
  device_map: auto
  dtype: bfloat16
  attn_implementation: sdpa
hydra:
  launcher:
    timeout_min: 180
    cpus_per_task: 16
    gpus_per_node: 1
    mem_gb: 32
    partition: gpu_a100
    array_parallelism: 1000
    setup:
      - module purge
      - module load 2023
      - module load CUDA/12.4.0
      - source scripts/environment/activate_env.sh main
