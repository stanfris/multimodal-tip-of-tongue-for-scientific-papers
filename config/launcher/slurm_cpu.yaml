# @package _global_

defaults:
  - override /hydra/launcher: submitit_slurm
dataset_dir: ${oc.env:VTT_DATA_ROOT,/scratch-shared/sfris1}
launcher:
  kind: slurm
  base_dir: ${dataset_dir}
  run_dir: ${oc.env:VTT_RUN_ROOT,./runs}
  python: ${oc.env:VTT_PYTHON,./.venv/bin/python}
  partition: rome
  gpus: 0
  cpus: 16
  memory: 28G
  walltime: 03:00:00
  device_map: cpu
  dtype: float32
  attn_implementation: eager
hydra:
  launcher:
    timeout_min: 180
    cpus_per_task: 16
    gpus_per_node: 0
    mem_gb: 28
    partition: rome
    array_parallelism: 1000
    setup:
      - module purge
      - module load 2023
      - source scripts/environment/activate_env.sh main
