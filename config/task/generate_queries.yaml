# @package _global_

task:
  name: generate_queries
  command: generate-queries
  set: train
  args: []
  script_folder: query_generation
hydra:
  job:
    name: generate_queries
  run:
    dir: ${oc.env:VTT_LOG_ROOT,./logs}/query_generation/generate_queries/${now:%Y%m%dT%H%M%S}
  sweep:
    dir: ${oc.env:VTT_LOG_ROOT,./logs}/query_generation/generate_queries/${now:%Y%m%dT%H%M%S}
    subdir: ${hydra.job.num}
