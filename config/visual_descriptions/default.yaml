name: qwen3_vl_figure_description
prompt:
  name: visual_interpretation
  version: v2
  template: prompts/visual_interpretation.v2.txt
  variables:
  - image
model:
  provider: ${model.provider}
  name: ${model.name}
selection:
  all: true
  start_index: 0
  end_index: null
  limit: ${stage.limit}
  resume: true
  overwrite: false
generation:
  max_tokens: 600
  temperature: 0.0
  batch_size: 1
  device_map: ${model.device_map}
  dtype: ${model.dtype}
  attn_implementation: ${model.attn_implementation}
  debug: false
