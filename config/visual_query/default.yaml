name: query_generation
seed: 13
prompt:
  name: query_generation
  version: v1
  template: prompts/query_generation.v1.txt
  variables:
  - selected_cues
model:
  provider: transformers
  name: microsoft/phi-4
  temperature: 0.2
  max_tokens: 300
  device_map: ${launcher.device_map}
  dtype: ${launcher.dtype}
  attn_implementation: ${launcher.attn_implementation}
  thinking: false
judgement:
  enabled: false
  name: query_judgement
  version: v1
  template: prompts/query_judgement.v1.txt
  provider: transformers
  model: google/gemma-3-27b-it
  temperature: 0.0
  max_tokens: 900
  device_map: ${launcher.device_map}
  dtype: ${launcher.dtype}
  attn_implementation: ${launcher.attn_implementation}
  run:
    modes:
    - visual-only
    - visual-and-text
    limit: null
    overwrite: false
selection:
  modes:
  - visual-and-text
  - visual-only
  visual_component_budget: 3
  textual_component_budget: 3
  allow_partial_components: false
  start_index: 0
  end_index: null
  max_examples: null
  resume: true
output:
  dir: ${dataset.root}/query_collections_test
query_sets:
  train:
    split_name: train
    collection_id: query_generation_train
    start_index: 0
    end_index: null
    max_examples: null
    resume: true
  test:
    split_name: test
    collection_id: query_generation_test
    start_index: 0
    end_index: null
    max_examples: null
    resume: true
